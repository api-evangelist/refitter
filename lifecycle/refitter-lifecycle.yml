notes: >-
  Refitter is a developer tool, not a hosted API — it ships as NuGet packages, a
  container image and a GitHub Action, so its lifecycle surface is release
  cadence, versioning and breaking-change policy rather than an SLA or uptime
  status page. Recorded absences below are real observations, not gaps we failed
  to look for.
