  release_feed: https://github.com/christianhelle/refitter/releases
  release_cadence_observed: >-
    Six releases between 2026-05-01 (2.0.0) and 2026-08-02 (2.1.3); prior 1.x
    line released roughly monthly from 2025.
deprecation:
  policy_url: https://refitter.github.io/articles/breaking-changes-v2-0-0.html
  policy_style: >-
    Breaking changes are gathered into a major version and shipped with a
    dedicated migration article naming each break, its impact, and step-by-step
    migration. v2.0.0 documented two breaking changes with before/after
    configuration examples and links to the commits and PRs that made them.
  sunset_header: null
  note: >-
    No RFC 8594 Sunset/Deprecation header applies — there is no HTTP surface.
    Deprecation of generated output is handled the other way round: the CLI
    exposes --no-deprecated-operations to skip operations a consumed OpenAPI
    marks deprecated.
